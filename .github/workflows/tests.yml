name: Tests

on:
  pull_request:
    # Run on all pull requests regardless of target branch
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # mip's bundled CBC binary for macOS arm64 (mip==1.16rc0) is linked against
      # Homebrew's gcc libgfortran at a fixed path - without it, every solver test
      # (battery/load_flex/hybrid) fails to even load the solver. Same requirement
      # applies to anyone installing this on an Apple Silicon Mac, see README.
      - name: Install gfortran (macOS only - mip's CBC binary needs it)
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # --locked fails the build if pyproject.toml and uv.lock have drifted
      # apart, instead of silently re-resolving a different set of versions
      # to run the tests against.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/
