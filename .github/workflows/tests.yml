name: Tests

on:
  pull_request:
    # Run on all pull requests regardless of target branch
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # --locked fails the build if pyproject.toml and uv.lock have drifted
      # apart, instead of silently re-resolving a different set of versions
      # to run the tests against.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/
